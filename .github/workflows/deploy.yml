name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Prefer repo Variable "AWS_REGION"; otherwise us-east-1 (override if your EKS/ECR live elsewhere)
  AWS_ENDPOINT_URL: ${{ secrets.LOCALSTACK_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: auth-service
  K8S_DEPLOYMENT: auth-service
  K8S_CONTAINER: auth-service

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: test
          aws-secret-access-key: test
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Manual ECR Login (LocalStack)
        id: ecr
        run: |
          # Define the LocalStack Registry URL
          REGISTRY="000000000000.dkr.ecr.${{ env.AWS_REGION }}.localhost.localstack.cloud:4566"
          
          # Create the repo if it doesn't exist (LocalStack specific safety)
          aws --endpoint-url=${{ env.AWS_ENDPOINT_URL }} ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} || true
          
          # Login to Docker
          aws --endpoint-url=${{ env.AWS_ENDPOINT_URL }} ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin $REGISTRY
          
          # Export for next steps
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: kubeconfig
        run: |
          # You MUST provide the endpoint URL to the AWS CLI here as well
          aws --endpoint-url=${{ env.AWS_ENDPOINT_URL }} eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Rollout new image
        run: |
          kubectl -n default set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE_URI" --record
          kubectl -n default rollout status "deployment/$K8S_DEPLOYMENT" --timeout=5m
