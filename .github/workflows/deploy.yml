name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_ENDPOINT_URL: ${{ secrets.LOCALSTACK_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
  ECR_IMAGE_NAME: auth-service
  K8S_NAMESPACE: social-app
  K8S_DEPLOYMENT: auth-service
  K8S_CONTAINER: auth-service

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "000000000000"
          registry-type: private

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$ECR_IMAGE_NAME-$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
    
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"
      - name: Configure kubeconfig          # <-- add this before rollout
        run: |
          aws eks update-kubeconfig \
            --name yasna-localstack-cluster \
            --region $AWS_REGION

      - name: Rollout new image
        run: |
          kubectl -n $K8S_NAMESPACE annotate deployment "$K8S_DEPLOYMENT" \
            kubernetes.io/change-cause="deploy $IMAGE_URI commit=${{ github.sha }}" \
            --overwrite
          kubectl -n $K8S_NAMESPACE set image \
            "deployment/$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$IMAGE_URI"
          kubectl -n $K8S_NAMESPACE rollout status \
            "deployment/$K8S_DEPLOYMENT" \
            --timeout=5m
